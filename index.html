<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="c-product-preview-card">
      <div class="c-product-preview-card__img-box">
        <picture class="c-product-preview-card__product-img">
          <source media="(min-width: 768px)" srcset="images/image-product-desktop.jpg">
          <img src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
        </picture>
      </div>

      <div class="c-product-preview-card__text-box">
        <p class="c-product-preview-card__category">Perfume</p>

        <h2 class="c-product-preview-card__title">Gabrielle Essence Eau De Parfum</h2>

        <p class="c-product-preview-card__descripton">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

        <div class="c-product-preview-card__price-box">
          <p class="c-product-preview-card__price">$149.99</p>
          <p class="c-product-preview-card__original-price"><s>$169.99</s></p>
        </div>
        
        <button class="button"><img src="/images/icon-cart.svg" alt="">Add to Cart</button>
      </div>
    </div>
  </main>
</body>
</html>
